name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VIDFISH_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p vidfish
      - run: ./target/release/vidfish --check
        if: runner.os == 'Linux'
      - run: ./target/release/vidfish.exe --check
        if: runner.os == 'Windows'
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(./target/release/vidfish --version)" = "vidfish $VIDFISH_VERSION"
          mkdir -p dist
          cp target/release/vidfish README.md dist/
          tar -C dist -czf "vidfish-${VIDFISH_VERSION}-linux-x86_64.tar.gz" vidfish README.md
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((& ./target/release/vidfish.exe --version) -ne "vidfish $env:VIDFISH_VERSION") { throw 'Version mismatch' }
          New-Item -ItemType Directory dist
          Copy-Item target/release/vidfish.exe, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "vidfish-$env:VIDFISH_VERSION-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: vidfish-${{ matrix.platform }}
          path: vidfish-0.1.${{ github.run_number }}-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release at the tested merge commit
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum vidfish-* > SHA256SUMS
          # A successful rerun must not replace an already-published release.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; leaving it unchanged."
          else
            gh release create "v${VERSION}" vidfish-* SHA256SUMS \
              --target "$GITHUB_SHA" --title "Vidfish ${VERSION}" --generate-notes
          fi
