name: Rust
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: 0.1.0-ci.${{ github.run_number }}
      # Package the installer branch without rerunning test suites; the user will test on Windows.
      windows: ${{ github.head_ref == 'epic/41-installers-updater' || github.ref_name == 'epic/41-installers-updater' }}
      windows_only: ${{ github.head_ref == 'epic/41-installers-updater' || github.ref_name == 'epic/41-installers-updater' }}
      windows_tests: false
