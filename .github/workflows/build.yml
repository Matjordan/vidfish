name: Build and package
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      windows:
        description: Include Windows compilation and packaging
        type: boolean
        default: true
      windows_only:
        description: Build and package Windows only, without a Linux job
        type: boolean
        default: false
      checks:
        description: Run optional test, lint and runtime checks (off by default)
        type: boolean
        default: false
      package:
        description: Package and upload runtime bundles and installers
        type: boolean
        default: true
      windows_tests:
        description: Run Windows checks (paused at the user's request)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-latest","platform":"windows-x86_64"}]' || inputs.windows && '[{"os":"ubuntu-22.04","platform":"linux-x86_64"},{"os":"windows-latest","platform":"windows-x86_64"}]' || '[{"os":"ubuntu-22.04","platform":"linux-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VIDFISH_VERSION: ${{ inputs.version }}
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux media dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup-gstreamer-linux.sh
      - name: Cache verified Windows SDK downloads
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vidfish-gstreamer
          key: gstreamer-msvc-x86_64-1.26.10
      - name: Install Windows media dependencies
        if: runner.os == 'Windows'
        run: ./scripts/setup-gstreamer.ps1
      - name: Validate PowerShell helper syntax
        if: inputs.checks && runner.os == 'Windows' && inputs.windows_tests
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors -join "`n") }
          }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: ${{ inputs.checks && 'rustfmt, clippy' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - if: inputs.checks && (runner.os != 'Windows' || inputs.windows_tests)
        run: cargo fmt --all --check
      - if: inputs.checks && (runner.os != 'Windows' || inputs.windows_tests)
        run: python scripts/run-cargo-tests.py clippy --locked --workspace --all-targets --all-features -- -D warnings
      - if: inputs.checks && (runner.os != 'Windows' || inputs.windows_tests)
        run: python scripts/run-cargo-tests.py
      - run: cargo build --locked --release -p vidfish
      - if: inputs.checks && (runner.os != 'Windows' || inputs.windows_tests)
        run: cargo build --locked --all-features -p vidfish-media --example camera-fixture
      - name: Check Linux runtime and desktop crash isolation
        if: inputs.checks && runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          ./target/release/vidfish --check
          ./target/release/vidfish --media-check
          xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/media-smoke.py --binary target/release/vidfish --fixture target/debug/examples/camera-fixture --desktop
          xvfb-run -a -s '-screen 0 1280x800x24' ./target/release/vidfish --demo --desktop-seconds 5 --no-update-check
          xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/operator-smoke.py --binary target/release/vidfish --fixture target/debug/examples/camera-fixture
          xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/camera-cleanup-smoke.py --binary target/release/vidfish --fixture target/debug/examples/camera-fixture --size 800x600
          python3 scripts/acquisition-smoke.py --binary target/release/vidfish --fixture target/debug/examples/camera-fixture
      - name: Check Windows runtime and RTSP recording
        if: inputs.checks && runner.os == 'Windows' && inputs.windows_tests
        run: |
          ./target/release/vidfish.exe --check
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle check failed' }
          ./target/release/vidfish.exe --media-check
          if ($LASTEXITCODE -ne 0) { throw 'Media runtime check failed' }
          python scripts/media-smoke.py --binary target/release/vidfish.exe --fixture target/debug/examples/camera-fixture.exe
          if ($LASTEXITCODE -ne 0) { throw 'RTSP recording smoke test failed' }
          python scripts/acquisition-smoke.py --binary target/release/vidfish.exe --fixture target/debug/examples/camera-fixture.exe
          if ($LASTEXITCODE -ne 0) { throw 'Managed recording owner-crash smoke test failed' }
      - name: Check Windows desktop launch
        if: inputs.checks && runner.os == 'Windows' && inputs.windows_tests
        run: |
          $output = & ./target/release/vidfish.exe --demo --desktop-seconds 5 --no-update-check 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) {
            $message = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows desktop smoke failed::$message"
            throw 'Desktop smoke test failed'
          }
          python scripts/operator-smoke.py --binary target/release/vidfish.exe --fixture target/debug/examples/camera-fixture.exe
          if ($LASTEXITCODE -ne 0) { throw 'Operator interaction smoke failed' }
      - name: Build previous-version upgrade fixture
        if: inputs.package && inputs.checks && (runner.os != 'Windows' || inputs.windows_tests)
        env:
          VIDFISH_VERSION: 0.0.1
        run: cargo build --locked -p vidfish --bin vidfish
      - name: Package Linux runtime
        if: inputs.package && runner.os == 'Linux'
        env:
          VIDFISH_PACKAGE_CHECKS: ${{ inputs.checks && '1' || '0' }}
        run: bash scripts/package-linux.sh
      - name: Package Windows runtime
        env:
          VIDFISH_PACKAGE_CHECKS: ${{ inputs.checks && inputs.windows_tests && '1' || '0' }}
          VIDFISH_SIGN_CERT_BASE64: ${{ secrets.VIDFISH_SIGN_CERT_BASE64 }}
          VIDFISH_SIGN_CERT_PASSWORD: ${{ secrets.VIDFISH_SIGN_CERT_PASSWORD }}
        if: inputs.package && runner.os == 'Windows'
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: vidfish-${{ matrix.platform }}
          path: vidfish-${{ inputs.version }}-${{ matrix.platform }}*
          if-no-files-found: error

      - name: Check Linux installer, updater and recording guard
        if: inputs.package && inputs.checks && runner.os == 'Linux'
        run: python3 scripts/installer-smoke.py --bundle dist/linux/vidfish-${{ inputs.version }} --fixture target/debug/examples/camera-fixture --previous-binary target/debug/vidfish
      - name: Check native Linux update prompt and restart
        if: inputs.package && inputs.checks && runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x800x24' python3 scripts/update-ui-smoke.py --bundle dist/linux/vidfish-${{ inputs.version }} --fixture target/debug/examples/camera-fixture
      - name: Check Windows installer and rollback
        if: inputs.package && inputs.checks && runner.os == 'Windows' && inputs.windows_tests
        run: python scripts/installer-smoke.py --bundle dist/windows/vidfish-${{ inputs.version }} --fixture target/debug/examples/camera-fixture.exe --previous-binary target/debug/vidfish.exe --native-installer vidfish-${{ inputs.version }}-windows-x86_64-setup.exe
      - name: Check native Windows updates
        if: inputs.package && inputs.checks && runner.os == 'Windows' && inputs.windows_tests
        run: python scripts/update-ui-smoke.py --bundle dist/windows/vidfish-${{ inputs.version }} --fixture target/debug/examples/camera-fixture.exe
