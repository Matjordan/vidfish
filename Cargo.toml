[workspace]
members = ["crates/vidfish-core", "crates/vidfish-app", "crates/vidfish-media"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }
tracing = "0.1"
tempfile = "3"
