[package]
name = "vidfish"
default-run = "vidfish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:wgpu", "dep:rfd", "dep:winit"]
wgpu-desktop = ["desktop", "eframe/wgpu", "wgpu/vulkan", "wgpu/gles"]

[dependencies]
rfd = { version = "0.15", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.18"
time = { version = "0.3", features = ["formatting"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fs2 = "0.4"
vidfish-core = { path = "../vidfish-core" }
vidfish-media = { path = "../vidfish-media" }
vidfish-onvif = { path = "../vidfish-onvif" }
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
wgpu = { version = "27.0.1", optional = true, default-features = false, features = ["std", "wgsl"] }

# GNOME Wayland requires client-side decorations. Keep winit's themed frame
# enabled even though eframe's broad default feature set is disabled.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", optional = true, default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", optional = true, default-features = false, features = ["wgpu"] }
wgpu = { version = "27.0.1", optional = true, default-features = false, features = ["dx12"] }

[dev-dependencies]
vidfish-media = { path = "../vidfish-media", features = ["fixtures"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
