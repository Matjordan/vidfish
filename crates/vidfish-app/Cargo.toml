[package]
name = "vidfish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:wgpu"]
wgpu-desktop = ["desktop", "eframe/wgpu", "wgpu/vulkan", "wgpu/gles"]

[dependencies]
fs2 = "0.4"
vidfish-core = { path = "../vidfish-core" }
vidfish-media = { path = "../vidfish-media" }
vidfish-onvif = { path = "../vidfish-onvif" }
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
wgpu = { version = "27.0.1", optional = true, default-features = false, features = ["std", "wgsl"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", optional = true, default-features = false, features = ["wgpu"] }
wgpu = { version = "27.0.1", optional = true, default-features = false, features = ["dx12"] }

[dev-dependencies]
vidfish-media = { path = "../vidfish-media", features = ["fixtures"] }
